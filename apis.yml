  description: 'REST API behind the Alkira Portal (Cloud Services Exchange). Manages
    tenant networks, segments, cloud and site connectors (AWS, Azure, GCP, OCI, and
    SD-WAN vendors), integrated network services, routing/traffic/NAT policies, BGP
    lists, groups, and health/monitoring. Authenticated with a per-user API key; most
    resources hang off a tenant network id resolved at session start.'
