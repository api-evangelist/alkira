name: Alkira
description: 'Alkira delivers Network Infrastructure as a Service (NaaS) through its
  Cloud Services Exchange, letting enterprises build, deploy, and manage a global
  multi-cloud network from a unified portal without provisioning physical hardware.
  The platform connects clouds, sites, remote users, and SaaS through Cloud Exchange
  Points (CXPs) with built-in segmentation, routing, integrated firewall/security
  services (Palo Alto, Fortinet, Check Point, Cisco, Zscaler, Infoblox, F5), and full-stack
  visibility. Everything provisioned in the portal is driven by the Alkira Portal REST
  API and exposed as infrastructure-as-code via an official Terraform provider, a Go
  client library, and a published Model Context Protocol (MCP) server for AI agents.'
